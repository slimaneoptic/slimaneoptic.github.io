<style>
:root { --ink: #14202B; --paper: #F6F8FA; --slate: #5B6B7A; --rule: #D5DBE1; --blue: #2A78D6; --bar: 3.25rem; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: "Overpass", system-ui, sans-serif; }
.bar { height: var(--bar); box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 1rem;
       padding: 0 1.25rem; border-bottom: 1px solid var(--rule); background: var(--paper); }
.who { display: flex; align-items: baseline; gap: 0.75rem; min-width: 0; }
.name { font-weight: 800; color: var(--ink); text-decoration: none; white-space: nowrap; }
.demo { color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 0.75rem; border-left: 1px solid var(--rule); }
.links { display: flex; align-items: center; gap: 1.25rem; font-size: 0.95rem; flex-shrink: 0; }
.links a { color: var(--ink); text-decoration: none; }
.links a:hover { color: var(--blue); }
.btn { background: var(--ink); color: #fff !important; padding: 0.45rem 0.85rem 0.35rem; border-radius: 7px; font-weight: 600; }
.btn:hover { background: #22364a; }
a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 4px; }
iframe { border: 0; display: block; width: 100%; height: calc(100vh - var(--bar)); height: calc(100dvh - var(--bar)); }
@media (max-width: 640px) { .demo, .links .all { display: none; } .bar { padding: 0 0.9rem; } }
