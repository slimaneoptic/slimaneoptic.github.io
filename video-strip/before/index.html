<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Video strip, heavy version</title>
<style>
:root{--ink:#14202B;--paper:#F6F8FA;--card:#fff;--slate:#5B6B7A;--rule:#D5DBE1;--blue:#2A78D6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}
.bar{height:3.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0 1.25rem;border-bottom:1px solid var(--rule)}
.bar a{color:var(--ink);text-decoration:none;font-weight:700;white-space:nowrap}
.bar span{color:var(--slate);font-size:.95rem;white-space:nowrap}
@media(max-width:560px){.bar span{display:none}}
main{max-width:760px;margin:0 auto;padding:1.25rem 1rem 3rem}
h1{font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.3;margin:0 0 .4rem}
h2{font-size:1.1rem;margin:0 0 .6rem}
.strip{background:#E8F0FB;border-left:4px solid var(--blue);padding:.6rem .9rem;border-radius:6px;margin:0 0 1.2rem}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1rem 1.1rem;margin:0 0 1rem}
.small{color:var(--slate);font-size:.92rem}
a{color:var(--blue)}
.vs{width:100%;overflow:hidden;margin:0 0 1.2rem}
.track{display:flex;width:max-content;will-change:transform;animation:slide 28s linear infinite}
.item{flex:none;padding-right:12px}
.item video{display:block;width:180px;height:320px;aspect-ratio:9/16;border-radius:10px;background:#0a2540;object-fit:cover}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.35rem .5rem;border-bottom:1px solid var(--rule)}
</style>
<script defer src="/hit.js"></script>
</head>
<body>
<div class="bar"><a href="/">Slimane Chanchoul</a><span>Demo: heavy version</span></div>
<div class="vs" role="region" aria-label="Sample video strip, heavy version"><div class="track" id="track"></div></div>
<main>
<h1>The heavy version</h1>
<p class="strip">Same sample clips, loaded the heavy way. Used only for the speed comparison.</p>
<div class="card"><p>Every video autoplays right away, preload is on, and there are no poster images.</p>
<p><a href="../">Back to the light version</a></p></div>
</main>
<script>
const CLIPS = [1,2,3,4,5,6,7].map(n => ({ video: "../media/clip"+n+".mp4", poster: "../media/poster"+n+".jpg" }));
const track = document.getElementById("track");
for (const copy of [0,1]) CLIPS.forEach(c => {
  const d = document.createElement("div"); d.className = "item"; if (copy) d.setAttribute("aria-hidden","true");
  const v = document.createElement("video");
  v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = "auto";
  v.setAttribute("muted",""); v.setAttribute("playsinline","");
  v.width = 180; v.height = 320; v.src = c.video; v.tabIndex = -1;
  d.appendChild(v); track.appendChild(d);
});
</script>
</body>
</html>
