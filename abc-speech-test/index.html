<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speech Test</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
:root { --bg:#F6F8FA; --card:#fff; --ink:#14202B; --slate:#5B6B7A; --rule:#D5DBE1; --blue:#2A78D6; --ok:#1F7A3A; --okbg:#E8F5EC; --bad:#B3261E; --badbg:#FDECEA; --warn:#9A5B00; --warnbg:#FFF4E0; --red:#D93F3F; }
@media (prefers-color-scheme: dark) { :root { --bg:#11181F; --card:#1A232C; --ink:#E9EEF3; --slate:#9FB0BF; --rule:#33424F; --ok:#6FD08F; --okbg:#17331F; --bad:#FF9A92; --badbg:#3A1C1A; --warn:#F0C070; --warnbg:#3A2C12; } }
html, body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; line-height:1.5; }
main { max-width:560px; margin:0 auto; padding:1rem 16px 3rem; }
h1 { font-size:1.4rem; margin:.2rem 0 .3rem; }
.hint { color:var(--slate); font-size:.9rem; margin:0 0 1rem; }
.card { background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:1rem; margin:0 0 1rem; }
.pills { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 .8rem; }
.pills label { display:flex; align-items:center; gap:.35rem; padding:.45rem .7rem; border:1px solid var(--rule); border-radius:8px; cursor:pointer; font-size:.95rem; }
button { font:inherit; border-radius:8px; cursor:pointer; padding:.6rem 1rem; border:1px solid var(--rule); background:var(--card); color:var(--ink); }
button.main { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; width:100%; padding:.9rem; font-size:1.1rem; }
button.main.on { background:var(--red); border-color:var(--red); }
button[disabled] { opacity:.5; cursor:not-allowed; }
[hidden] { display:none !important; }
#bar { height:8px; background:var(--rule); border-radius:4px; overflow:hidden; margin:.5rem 0 0; } #bar div { height:100%; width:0; background:var(--blue); }
#msg { font-size:.92rem; color:var(--slate); margin:.5rem 0 0; overflow-wrap:anywhere; }
.pic { display:block; width:100%; max-width:240px; aspect-ratio:1; object-fit:cover; border-radius:8px; margin:0 auto .7rem; background:var(--rule); }
.count { color:var(--slate); font-size:.9rem; margin:0 0 .4rem; }
.words { display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; margin:0 0 .9rem; }
.words span { padding:.3rem .7rem; border:1px solid var(--rule); border-radius:999px; }
#state { text-align:center; font-weight:700; min-height:1.5em; margin:.6rem 0 0; }
#out { margin:.8rem 0 0; padding:.7rem; border-radius:8px; }
#out.right { background:var(--okbg); color:var(--ok); } #out.wrong { background:var(--badbg); color:var(--bad); } #out.other { background:var(--warnbg); color:var(--warn); }
#out .said { font-size:1.2rem; font-weight:700; overflow-wrap:anywhere; }
.row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:.5rem; margin:.8rem 0 0; }
.tbl { overflow-x:auto; } table { width:100%; border-collapse:collapse; font-size:.85rem; }
th, td { text-align:left; padding:.3rem .35rem; border-top:1px solid var(--rule); overflow-wrap:anywhere; } th { color:var(--slate); font-weight:600; border-top:0; }
#sum { font-weight:700; margin:0 0 .5rem; }
</style>
</head>
<body>
<main>
  <h1>Speech test</h1>
  <p class="hint">Private test. Speech-to-text runs on this device and the recording is not uploaded. The first start downloads the model once.</p>

  <section class="card" id="setup">
    <div class="pills">
      <label><input type="radio" name="model" value="tiny" checked> Tiny (41 MB)</label>
      <label><input type="radio" name="model" value="base"> Base (77 MB)</label>
    </div>
    <button class="main" id="load">Start test</button>
    <div id="bar" hidden><div></div></div>
    <p id="msg"></p>
  </section>

  <section class="card" id="test" hidden>
    <p class="count" id="count"></p>
    <img class="pic" id="pic" alt="" referrerpolicy="no-referrer">
    <div class="words" id="words"></div>
    <button class="main" id="rec">🎤 Record</button>
    <p id="state" aria-live="polite"></p>
    <div id="out" hidden><div>You said:</div><div class="said" id="said"></div><div id="verdict"></div></div>
    <div class="row" id="after" hidden>
      <button id="play">▶ My voice</button><button id="again">Again</button><button id="next">Next</button>
    </div>
    <audio id="audio" hidden></audio>
  </section>

  <section class="card" id="results" hidden>
    <p id="sum"></p>
    <div class="tbl"><table><thead><tr><th>Model</th><th>Word</th><th>You said</th><th>Result</th><th>Clip</th><th>Took</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var BASE = 'https://abcinternationalonline.com/wp-content/uploads/elementor/thumbs/';
  var ITEMS = [
    { answer: 'beast', others: ['feast', 'east'], img: 'wallpaper-background-lion-4106667-ovvjqbarfbxrtxejlxdwbqfif733r3qtx2rsd2andc.jpg' },
    { answer: 'queen', others: ['queer', 'quick'], img: 'queen-crowning-royalty-2941437-ovz5ndmjpchj7xpfu445jzr7l4fh50d8mebevhkcsw.jpg' },
    { answer: 'bean', others: ['lean', 'mean'], img: 'bean-ovgqm2v7e77sdv70rz87ktsmpb5yxvwlwc52qet9e8.jpg' },
    { answer: 'beetle', others: ['kettle', 'settle'], img: 'beetle-ovgqmqd6523yg48vyrdvt5v5jxy5abhwbkg7qbuf2o.jpeg' },
    { answer: 'key', others: ['sea', 'fee'], img: 'key-2-ovf26m8bwz67vh6ay4fjaaq46bqp4kgzsssa8ue47k.jpg' },
    { answer: 'tea', others: ['team', 'tease'], img: 'lession_33_topic_33.P.17-ovx056jikqx1qcmfmjb6kl872ayd9wha07erf8m8y8.png' },
    { answer: 'bee', others: ['tee', 'glee'], img: 'sunflower-bees-nectar-5467771-ovvjw8o4iq1v1eslzzm7jql59nvfae9weev0avia4w.jpg' },
    { answer: 'greet', others: ['flea', 'sea'], img: 'good-morning-ovgrc8phm713j56y0acdz84hxe7r6lrnhttllo0s7k.jpg' },
    { answer: 'sleep', others: ['keep', 'steep'], img: 'sleep4-ovgsde9trfw4g9821uii1clf8p32fw9oxq5jiexk9c.jpg' },
    { answer: 'leaf', others: ['beef', 'leave'], img: 'dreamstimefree_16447655-scaled-ovgr1vjk8yu9hy8zjb1hzcai3fb1arm7qitu2te2ts.jpg' }
  ];
  var SAME = { tea: ['t', 'tee'], tee: ['t', 'tea'], bee: ['b', 'be'], bean: ['been'], key: ['quay'], sea: ['see', 'c'], flea: ['flee'], tease: ['teas', 'tees'], team: ['teem'] };
  var RATE = 16000, MAX_SECONDS = 4, END_SILENCE_MS = 700;

  var $ = function (id) { return document.getElementById(id); };
  var worker = new Worker('worker.js?v=1', { type: 'module' });
  var S = { model: 'tiny', i: 0, stream: null, ctx: null, source: null, node: null, chunks: [], recording: false, clip: null, url: null, runId: 0, rows: [] };
  var waiting = {};

  function norm(s) { return String(s || '').toLowerCase().replace(/[‘’']/g, '').replace(/[^a-z0-9\s-]/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim(); }
  // Whisper marks silence and noise in brackets, such as [BLANK_AUDIO] or (wind blowing).
  function clean(s) { return String(s || '').replace(/\[[^\]]*\]|\([^)]*\)|\*[^*]*\*/g, ' ').replace(/\s+/g, ' ').trim(); }
  function says(text, word) {
    var parts = norm(text).split(' ').filter(Boolean), forms = [word].concat(SAME[word] || []);
    return parts.length > 0 && parts.length <= 4 && parts.some(function (p) { return forms.indexOf(p) !== -1; });
  }
  function judge(text, item) {
    var options = [item.answer].concat(item.others);
    var hits = options.filter(function (o) { return says(text, o); });
    if (hits.length === 1) { return hits[0] === item.answer ? 'right' : 'wrong'; }
    return 'other';
  }
  window.__speechTest = { judge: judge, clean: clean, S: S, transcribe: transcribe };

  worker.onmessage = function (e) {
    var m = e.data;
    if (m.type === 'progress') {
      $('bar').hidden = false;
      $('bar').firstElementChild.style.width = Math.round(100 * m.done / m.all) + '%';
      $('msg').textContent = 'Downloading the model: ' + Math.round(m.done / 1e6) + ' of ' + Math.round(m.all / 1e6) + ' MB';
    } else if (m.type === 'loaded') {
      $('msg').textContent = 'Model ready in ' + (m.ms / 1000).toFixed(1) + ' s.';
      $('bar').hidden = true;
      $('load').disabled = false;
      $('test').hidden = false;
      showItem();
    } else if (m.type === 'result' || m.type === 'error') {
      if (m.id && waiting[m.id]) { waiting[m.id](m); delete waiting[m.id]; }
      else if (m.type === 'error') { $('msg').textContent = 'Error: ' + m.message; $('load').disabled = false; }
    }
  };
  worker.onerror = function (e) { $('msg').textContent = 'Could not start the speech model: ' + e.message; $('load').disabled = false; };

  function transcribe(audio) {
    var id = ++S.runId;
    return new Promise(function (resolve) {
      waiting[id] = resolve;
      worker.postMessage({ type: 'run', id: id, model: S.model, audio: audio });
    });
  }

  function showItem() {
    var it = ITEMS[S.i];
    $('count').textContent = 'Picture ' + (S.i + 1) + ' of ' + ITEMS.length;
    $('pic').src = BASE + it.img;
    $('pic').alt = 'Picture ' + (S.i + 1);
    var box = $('words');
    box.textContent = '';
    [it.answer].concat(it.others).sort().forEach(function (w) { var s = document.createElement('span'); s.textContent = w; box.appendChild(s); });
    resetOutput();
  }
  function resetOutput() { $('out').hidden = true; $('after').hidden = true; $('state').textContent = ''; $('rec').disabled = false; }

  function wav(samples) {
    var buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf), p = 0;
    function str(s) { for (var i = 0; i < s.length; i++) { v.setUint8(p++, s.charCodeAt(i)); } }
    function u32(x) { v.setUint32(p, x, true); p += 4; } function u16(x) { v.setUint16(p, x, true); p += 2; }
    str('RIFF'); u32(36 + samples.length * 2); str('WAVE'); str('fmt '); u32(16); u16(1); u16(1); u32(RATE); u32(RATE * 2); u16(2); u16(16); str('data'); u32(samples.length * 2);
    for (var i = 0; i < samples.length; i++) { var x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(p, x < 0 ? x * 32768 : x * 32767, true); p += 2; }
    return new Blob([buf], { type: 'audio/wav' });
  }

  function joined(chunks) {
    var n = chunks.reduce(function (a, c) { return a + c.length; }, 0), out = new Float32Array(n), p = 0;
    chunks.forEach(function (c) { out.set(c, p); p += c.length; });
    return out;
  }

  function ensureMic() {
    if (S.stream) { return Promise.resolve(); }
    return navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } }).then(function (stream) {
      S.stream = stream;
      S.ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });
      S.source = S.ctx.createMediaStreamSource(stream);
      S.node = S.ctx.createScriptProcessor(2048, 1, 1);
      var mute = S.ctx.createGain(); mute.gain.value = 0;
      S.source.connect(S.node); S.node.connect(mute); mute.connect(S.ctx.destination);
      S.node.onaudioprocess = onAudio;
    });
  }

  var vad = { spoke: false, floor: 0, blocks: 0, silentMs: 0, totalMs: 0 };
  function onAudio(e) {
    if (!S.recording) { return; }
    var d = new Float32Array(e.inputBuffer.getChannelData(0));
    S.chunks.push(d);
    var sum = 0, i, ms = 1000 * d.length / S.ctx.sampleRate;
    for (i = 0; i < d.length; i++) { sum += d[i] * d[i]; }
    var rms = Math.sqrt(sum / d.length);
    vad.totalMs += ms;
    if (vad.blocks < 3) { vad.floor += rms / 3; vad.blocks++; if (vad.blocks === 3) { $('state').textContent = 'Speak now'; } return; }
    if (rms > Math.max(0.012, vad.floor * 3)) { vad.spoke = true; vad.silentMs = 0; } else if (vad.spoke) { vad.silentMs += ms; }
    if ((vad.spoke && vad.silentMs >= END_SILENCE_MS) || vad.totalMs >= MAX_SECONDS * 1000) { stopRecording(); }
  }

  function startRecording() {
    $('rec').disabled = true;
    $('out').hidden = true; $('after').hidden = true;
    $('state').textContent = 'Getting the mic ready…';
    ensureMic().then(function () { return S.ctx.resume(); }).then(function () {
      S.chunks = [];
      vad = { spoke: false, floor: 0, blocks: 0, silentMs: 0, totalMs: 0 };
      S.recording = true;
      $('rec').disabled = false;
      $('rec').classList.add('on');
      $('rec').textContent = '■ Stop';
    }).catch(function (err) {
      $('rec').disabled = false;
      $('state').textContent = 'The microphone did not start: ' + err.name;
    });
  }

  function stopRecording() {
    if (!S.recording) { return; }
    S.recording = false;
    $('rec').classList.remove('on');
    $('rec').textContent = '🎤 Record';
    $('rec').disabled = true;
    var audio = joined(S.chunks), spoke = vad.spoke;
    if (S.url) { URL.revokeObjectURL(S.url); }
    S.url = URL.createObjectURL(wav(audio));
    $('audio').src = S.url;
    $('state').textContent = 'Working it out…';
    var seconds = audio.length / RATE;
    // Whisper invents words on silence, so a clip with no voice never reaches it.
    if (!spoke) { $('rec').disabled = false; show('', 0, seconds, false); return; }
    transcribe(audio).then(function (m) {
      $('rec').disabled = false;
      if (m.type === 'error') { $('state').textContent = 'Error: ' + m.message; return; }
      show(clean(m.text), m.ms, seconds, spoke);
    });
  }

  function show(text, ms, seconds, spoke) {
    var item = ITEMS[S.i], v = text ? judge(text, item) : 'other';
    var label = v === 'right' ? 'Right' : v === 'wrong' ? 'Wrong word, the answer is ' + item.answer : text ? 'Not one of the words' : 'Nothing came back';
    $('state').textContent = '';
    $('out').hidden = false;
    $('out').className = v;
    $('said').textContent = text || '(nothing)';
    $('verdict').textContent = label;
    $('after').hidden = false;
    $('next').textContent = S.i + 1 < ITEMS.length ? 'Next' : 'Restart';
    S.rows.push({ model: S.model, word: item.answer, text: text, v: v, seconds: seconds, ms: ms, spoke: spoke });
    table();
  }

  function table() {
    var body = $('rows');
    body.textContent = '';
    S.rows.slice().reverse().forEach(function (r) {
      var tr = document.createElement('tr');
      [r.model, r.word, r.text || '(nothing)', r.v, r.seconds.toFixed(1) + ' s', (r.ms / 1000).toFixed(1) + ' s'].forEach(function (c) { var td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
      body.appendChild(tr);
    });
    var parts = ['tiny', 'base'].map(function (m) {
      var rs = S.rows.filter(function (r) { return r.model === m; });
      if (!rs.length) { return ''; }
      var right = rs.filter(function (r) { return r.v === 'right'; }).length, avg = rs.reduce(function (a, r) { return a + r.ms; }, 0) / rs.length / 1000;
      return m + ': ' + right + ' right of ' + rs.length + ' tries, about ' + avg.toFixed(1) + ' s each';
    }).filter(Boolean);
    $('sum').textContent = parts.join(' · ');
    $('results').hidden = false;
    try { localStorage.setItem('speech-test', JSON.stringify(S.rows)); } catch (e) { /* no storage */ }
  }

  $('load').addEventListener('click', function () {
    var picked = document.querySelector('input[name="model"]:checked').value;
    S.model = picked;
    S.i = 0;
    $('load').disabled = true;
    $('msg').textContent = 'Starting…';
    worker.postMessage({ type: 'load', model: picked });
  });
  $('rec').addEventListener('click', function () { if (S.recording) { stopRecording(); } else { startRecording(); } });
  $('play').addEventListener('click', function () { var a = $('audio'); a.currentTime = 0; a.play(); });
  $('again').addEventListener('click', resetOutput);
  $('next').addEventListener('click', function () { S.i = (S.i + 1) % ITEMS.length; showItem(); window.scrollTo(0, 0); });
})();
</script>
</body>
</html>
